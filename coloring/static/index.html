<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanessa · Libros para Colorear</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
  /* Palette taken from the logo: ocean blue, leaf green, hibiscus coral, sunny yellow, wood. */
  :root {
    --bg: #fdf8ee; --card: #ffffff; --ink: #2b2420; --muted: #6f6257; --line: #eadfcc;
    --accent: #1b86c9; --accent-ink: #ffffff; --accent-soft: #e6f3fb;
    --ok: #2f9a4c; --ok-soft: #e7f6eb; --warn: #b9770e; --warn-soft: #fff3d6;
    --bad: #d6404a; --bad-soft: #fde9ea; --sun: #f5b72b; --wood: #8a5a2b;
    --round: "Fredoka", "Baloo 2", ui-rounded, "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 20px; padding: 8px 24px;
           background: var(--card); border-bottom: 4px solid var(--sun); position: sticky; top: 0; z-index: 5; }
  header .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
  header .brand img { height: 64px; width: auto; max-width: 110px; object-fit: contain; }
  header h1 { font: 600 21px/1.1 var(--round); margin: 0; color: var(--wood); }
  header h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
  h2, h3 { font-family: var(--round); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 8px 14px; border-radius: 8px; font: inherit;
               color: var(--muted); cursor: pointer; }
  nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  header .spacer { flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  section { display: none; } section.on { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .hint { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
  input[type=text], input[type=password], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; } .row > * { flex: 1 1 220px; }
  button.primary, button.secondary, button.danger {
    border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.secondary { background: #eef0f3; color: var(--ink); }
  button.danger { background: none; color: var(--bad); padding: 6px 8px; font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .msg { font-size: 14px; } .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }
  .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .char-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .char-head h3 { margin: 0; font-size: 17px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: #eef0f3; color: var(--muted); white-space: nowrap; }
  .badge.ready { background: var(--ok-soft); color: var(--ok); } .badge.training, .badge.queued { background: var(--warn-soft); color: var(--warn); }
  .badge.failed { background: var(--bad-soft); color: var(--bad); }
  .poses { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin: 12px 0; }
  .pose { border: 2px solid var(--line); border-radius: 8px; background: #fff; padding: 4px; cursor: pointer; position: relative; aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; }
  .pose img { max-width: 100%; max-height: 100%; }
  .pose.off { opacity: .3; border-style: dashed; }
  .pose.locked { cursor: default; }
  .bar { height: 8px; background: #eef0f3; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--ok), var(--accent)); width: 0; transition: width .5s; }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .pick label { margin: 0; font-weight: 500; border: 2px solid var(--line); border-radius: 10px; padding: 8px;
                display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; background: #fff; }
  .pick label.on { border-color: var(--accent); background: var(--accent-soft); }
  .pick img { height: 80px; } .pick input { display: none; }
  .kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .kinds label { margin: 0; font-weight: 500; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px;
                 cursor: pointer; background: #fff; display: flex; flex-direction: column; gap: 2px; }
  .kinds label.on { border-color: var(--accent); background: var(--accent-soft); }
  .kinds input { display: none; } .kinds span { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px;
         background: var(--warn-soft); color: var(--warn); margin-right: 6px; vertical-align: 1px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  .pagecard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .pagecard .img { background: #fff; aspect-ratio: 8.5/11; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); }
  .pagecard .img.land { aspect-ratio: 11/8.5; }
  .pagecard img { max-width: 100%; max-height: 100%; }
  .pagecard .body { padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .pagecard .scene { color: var(--ink); } .pagecard .who { color: var(--muted); font-size: 13px; }
  .pagecard .links { display: flex; gap: 12px; align-items: center; margin-top: auto; }
  .pagecard a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  dialog { border: 0; border-radius: 14px; padding: 24px; width: min(400px, calc(100% - 32px));
           box-shadow: 0 12px 40px rgba(43,36,32,.25); }
  dialog::backdrop { background: rgba(43,36,32,.35); }
  #login { max-width: 400px; margin: 6vh auto; text-align: center; }
  #login img { width: min(320px, 80%); height: auto; margin: 0 auto 8px; display: block; }
  #login form { text-align: left; }
  .empty { color: var(--muted); text-align: center; padding: 28px; }
  .langsw { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; color: var(--muted); }
  .pose .bw { position: absolute; right: 3px; bottom: 3px; font-size: 9px; font-weight: 700; background: var(--ink); color: #fff; border-radius: 4px; padding: 0 3px; }
  .note { font-size: 12px; color: var(--warn); }
  .status { border-left: 6px solid var(--sun); }
  .status h2 { margin: 0 0 8px; font-size: 18px; }
  .status .job { margin: 10px 0; }
  .status .job b { font-weight: 600; }
  .status .gpus { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .status .gpus span::before { content: "●"; margin-right: 6px; }
  .status .gpus .train::before { color: var(--accent); } .status .gpus .free::before { color: var(--ok); }
  .status .gpus .busy::before { color: var(--warn); }
  .groupnote { margin: 4px 0 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .groupnote.new, .groupnote.wait { background: var(--warn-soft); color: var(--warn); }
  .groupnote.ok { background: var(--ok-soft); color: var(--ok); }
  @media (max-width: 700px) { header { flex-wrap: wrap; gap: 8px; } header .brand img { height: 48px; }
                              header h1 small { display: none; } main { padding: 16px 12px 48px; } }
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <img id="loginLogo" src="/img/logo-es-720.png" alt="">
  <form id="loginForm">
    <label for="pw" data-i18n="password">Contraseña</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="actions"><button class="primary" type="submit" data-i18n="login">Entrar</button>
      <button class="langsw" type="button" data-lang-toggle></button><span id="loginMsg" class="msg err"></span></div>
  </form>
</div>

<div id="app" hidden>
<header>
  <a class="brand" href="/"><img id="brandLogo" src="/img/logo-es-300.png" alt=""><h1><span data-i18n="brandTitle"></span><small data-i18n="brandSub"></small></h1></a>
  <nav>
    <button data-tab="make" class="on" data-i18n="tabMake">Crear página</button>
    <button data-tab="pages" data-i18n="tabPages">Mis páginas</button>
    <button data-tab="chars" data-i18n="tabChars">Personajes</button>
  </nav>
  <div class="spacer"></div>
  <button class="langsw" type="button" data-lang-toggle></button>
  <button class="secondary" id="pwBtn" data-i18n="changePw">Cambiar contraseña</button>
  <button class="secondary" id="logout" data-i18n="logout">Salir</button>
</header>
<main>

<div id="trainStatus" class="card status" hidden aria-live="polite"></div>

<section id="tab-make" class="on">
  <div class="card">
    <h2 data-i18n="makeTitle">Crear una página para colorear</h2>
    <p class="hint" data-i18n="makeHint"></p>
    <label data-i18n="sceneChars">Personajes en la escena</label>
    <div id="pick" class="pick"></div>
    <div id="groupNote" class="groupnote" hidden></div>
    <label for="scene" data-i18n="sceneWhat">¿Qué pasa en la escena?</label>
    <textarea id="scene" maxlength="600" data-i18n-ph="scenePh"></textarea>
    <label data-i18n="whatToMake">Qué crear</label>
    <div class="kinds">
      <label class="on"><input type="radio" name="kind" value="page" checked><b data-i18n="kindPage"></b><span data-i18n="kindPageHint"></span></label>
      <label><input type="radio" name="kind" value="cover"><b data-i18n="kindCover"></b><span data-i18n="kindCoverHint"></span></label>
    </div>
    <div class="row">
      <div><label for="orient" data-i18n="pageLabel">Página</label>
        <select id="orient"><option value="portrait" data-i18n="portrait"></option><option value="landscape" data-i18n="landscape"></option></select></div>
      <div><label for="vars" data-i18n="howMany">Cuántas versiones probar</label>
        <select id="vars"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
    </div>
    <div class="actions"><button class="primary" id="makeBtn" data-i18n="create">Crear</button><span id="makeMsg" class="msg"></span></div>
  </div>
</section>

<section id="tab-pages">
  <div id="gallery" class="gallery"></div>
</section>

<section id="tab-chars">
  <div class="card">
    <h2 data-i18n="addTitle">Añadir un personaje</h2>
    <p class="hint" data-i18n="addHint"></p>
    <form id="addForm">
      <div class="row">
        <div><label for="cname" data-i18n="name">Nombre</label><input id="cname" type="text" maxlength="40" data-i18n-ph="namePh" required></div>
        <div><label for="ckind" data-i18n="whatItIs">Qué es</label><input id="ckind" type="text" maxlength="40" data-i18n-ph="kindPh" required></div>
      </div>
      <label for="csheet" data-i18n="sheetLabel">Ficha del personaje (PNG o JPG)</label>
      <input id="csheet" type="file" accept="image/png,image/jpeg,image/webp" required>
      <label for="csheetbw" data-i18n="sheetBwLabel"></label>
      <input id="csheetbw" type="file" accept="image/png,image/jpeg,image/webp">
      <div class="actions"><button class="primary" type="submit" id="addBtn" data-i18n="upload">Subir</button><span id="addMsg" class="msg"></span></div>
    </form>
  </div>
  <div id="chars" class="chars"></div>
</section>

</main>
</div>

<dialog id="pwDialog">
  <h2 data-i18n="changePw">Cambiar contraseña</h2>
  <form id="pwForm">
    <label for="pwCur" data-i18n="pwCurrent"></label>
    <input id="pwCur" type="password" autocomplete="current-password" required>
    <label for="pwNew" data-i18n="pwNew"></label>
    <input id="pwNew" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pwNew2" data-i18n="pwAgain"></label>
    <input id="pwNew2" type="password" autocomplete="new-password" minlength="8" required>
    <p class="hint" data-i18n="pwHint"></p>
    <div class="actions">
      <button class="primary" type="submit" data-i18n="save">Guardar</button>
      <button class="secondary" type="button" id="pwCancel" data-i18n="cancel">Cancelar</button>
      <span id="pwMsg" class="msg"></span>
    </div>
  </form>
</dialog>

    castUsed: "Group trained together: each character stays distinct.",
    castLearning: "This group is learning together - redo the page later for a better result.",
    statusTitle: "Training in progress",
    jobLearning: (who, p, eta) => `<b>${who}</b>: learning… ${p}%${eta ? ` · about ${eta} left` : ""}`,
    jobWaiting: who => `<b>${who}</b>: waiting for room on a graphics card`,
    jobQueued: (who, n) => `<b>${who}</b>: in line to train${n ? ` (#${n})` : ""}`,
    jobPreparing: who => `<b>${who}</b>: preparing…`,
    groupOf: "group",
    gpuTraining: (i, who) => `Card ${i}: training ${who}`,
    gpuFree: i => `Card ${i}: free`,
    gpuBusy: i => `Card ${i}: busy with other work`,
    statusHint: "Making more pages doesn't help training: each page is a fresh try, and deleting one changes nothing. While a group is training, its pages may come out with missing faces or characters; when it's done, press Redo.",
    groupNew: "New combination: these characters haven't been trained together yet. Make just 1 version now; that puts the group in line to train (about 3 hours). Until then faces or characters may come out incomplete.",
    groupQueued: "This group is in line to train together. Pages will come out better once it's done; see the progress above.",
    groupLearning: (p, eta) => `This group is training together (${p}%${eta ? `, about ${eta} left` : ""}). Pages will come out better once it's done.`,
    groupReady: "This group is trained together: each character stays distinct.",
    hm: (h, m) => h ? `${h} h ${m} min` : `${m} min`,
  },
};
let lang = "es";
try { lang = localStorage.getItem("lang") || "es"; } catch {}
const t = (k, ...a) => { const v = (I18N[lang] || I18N.es)[k]; return typeof v === "function" ? v(...a) : v ?? k; };
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-lang-toggle]").forEach(b => b.textContent = t("other"));
  document.title = t("docTitle");
  const ll = document.getElementById("loginLogo"), bl = document.getElementById("brandLogo");
  ll.src = t("logo"); ll.alt = t("logoAlt"); bl.src = t("logoSmall");
}
document.querySelectorAll("[data-lang-toggle]").forEach(b => b.onclick = () => {
  lang = lang === "es" ? "en" : "es";
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang(); drawChars(); drawPick(); drawPages(); drawStatus(); drawGroupNote();
});
applyLang();

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let characters = [], pages = [], picked = new Set(), timer = null;
let training = {jobs: [], groups: [], gpus: []};
const dateStr = s => new Date(s * 1000).toLocaleDateString(lang === "es" ? "es-PR" : "en-US");

async function api(path, opts = {}) {
  const res = await fetch(path, {credentials: "same-origin", ...opts});
  if (res.status === 401 && path !== "/api/login") { showLogin(); throw new Error("please log in"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : (data.detail?.[0]?.msg || "something went wrong"));
  return data;
}
const json = body => ({method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});

function showLogin() { $("#app").hidden = true; $("#login").hidden = false; $("#pw").focus(); clearTimeout(timer); }
async function start() { $("#login").hidden = true; $("#app").hidden = false; await refresh(); }

$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginMsg").textContent = "";
  try { await api("/api/login", json({password: $("#pw").value})); $("#pw").value = ""; await start(); }
  catch (err) { $("#loginMsg").textContent = err.message; }
};
$("#pwBtn").onclick = () => { $("#pwForm").reset(); $("#pwMsg").textContent = ""; $("#pwDialog").showModal(); $("#pwCur").focus(); };
$("#pwCancel").onclick = () => $("#pwDialog").close();
$("#pwForm").onsubmit = async e => {
  e.preventDefault(); const msg = $("#pwMsg"); msg.className = "msg err";
  if ($("#pwNew").value !== $("#pwNew2").value) { msg.textContent = t("pwMismatch"); return; }
  try {
    await api("/api/password", json({current: $("#pwCur").value, new: $("#pwNew").value}));
    msg.className = "msg ok"; msg.textContent = t("pwChanged");
    setTimeout(() => $("#pwDialog").close(), 1200);
  } catch (err) { msg.textContent = err.message; }
};
$("#logout").onclick = async () => { await api("/api/logout", {method: "POST"}).catch(() => {}); showLogin(); };

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "tab-" + b.dataset.tab));
});

async function refresh() {
  clearTimeout(timer);
  try {
    [characters, pages, training] = await Promise.all([api("/api/characters"), api("/api/pages"),
      api("/api/training").catch(() => ({jobs: [], groups: [], gpus: []}))]);
  } catch { return; }
  drawChars(); drawPick(); drawPages(); drawStatus(); drawGroupNote();
  const busy = characters.some(c => ["reading","queued","training"].includes(c.status)) || pages.some(p => ["queued","drawing"].includes(p.status))
    || training.jobs.length > 0;
  timer = setTimeout(refresh, busy ? 5000 : 30000);
}

function drawChars() {
  const box = $("#chars");
  if (!characters.length) { box.innerHTML = `<div class="empty card">${t("noChars")}</div>`; return; }
  box.innerHTML = characters.map(c => {
    const busy = ["reading","queued","training"].includes(c.status);
    const p = c.progress || {};
    const pct = p.total > 0 ? Math.round(100 * p.step / p.total) : 0;
    let line = "";
    if (c.status === "reading") line = t("lineReading");
    if (c.status === "queued") line = t("lineQueued", c.queue_position || 0);
    if (c.status === "training") line = p.stage === "training" ? t("lineLearning", esc(c.name), pct)
      : (p.stage || "").startsWith("waiting") ? t("lineWaiting") : t("linePreparing");
    if (c.status === "failed") line = `<span class="msg err">${esc(c.error || "failed")}</span>`;
    if (c.status === "new") line = t("lineNew");
    if (c.status === "ready") line = t("lineReady", dateStr(c.trained_at));
    const caps = c.captions || [], why = c.skip_reasons || {}, bw = new Set(c.line_partners || []);
    const poses = Array.from({length: c.crops || 0}, (_, i) => {
      const off = c.excluded.includes(i);
      const tip = [caps[i] || "", off ? `${t("poseOut")}${why[i] ? " - " + why[i] : ""}` : t("poseUsed")].filter(Boolean).join(" · ");
      return `<div class="pose ${off ? "off" : ""} ${busy ? "locked" : ""}" data-slug="${c.slug}" data-i="${i}" title="${esc(tip)}">
         <img loading="lazy" src="/api/characters/${c.slug}/crops/${i}" alt="${esc(caps[i] || "")}">${bw.has(i) ? `<span class="bw" title="${t("hasBw")}">B/N</span>` : ""}</div>`;
    }).join("");
    return `<div class="card">
      <div class="char-head"><h3>${esc(c.name)} <span class="hint">(${esc(c.kind_original || c.kind)})</span></h3><span class="badge ${c.status}">${t("st")[c.status] || c.status}</span></div>
      <div class="poses">${poses}</div>
      <div class="hint">${line}</div>
      ${c.status === "training" && p.stage === "training" ? `<div class="bar"><div style="width:${pct}%"></div></div>` : ""}
      <div class="actions">
        ${busy ? "" : `<button class="primary" data-train="${c.slug}">${c.status === "ready" ? t("trainAgain") : t("train")}</button>`}
        <a class="hint" href="/api/characters/${c.slug}/sheet" target="_blank">${t("viewSheet")}</a>
        <span class="spacer" style="flex:1"></span>
        ${busy ? "" : `<button class="danger" data-del="${c.slug}">${t("remove")}</button>`}
      </div></div>`;
  }).join("");
  box.querySelectorAll(".pose:not(.locked)").forEach(el => el.onclick = async () => {
    const c = characters.find(x => x.slug === el.dataset.slug), i = +el.dataset.i;
    const ex = new Set(c.excluded); ex.has(i) ? ex.delete(i) : ex.add(i);
    try { Object.assign(c, await api(`/api/characters/${c.slug}/poses`, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({excluded: [...ex]})})); drawChars(); }
    catch (err) { alert(err.message); }
  });
  box.querySelectorAll("[data-train]").forEach(b => b.onclick = async () => {
    const c = characters.find(x => x.slug === b.dataset.train);
    if (c.status === "ready" && !confirm(t("confirmRetrain", c.name))) return;
    b.disabled = true; try { await api(`/api/characters/${c.slug}/train`, {method: "POST"}); } catch (err) { alert(err.message); } refresh();
  });
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const c = characters.find(x => x.slug === b.dataset.del);
    if (!confirm(t("confirmRemove", c.name))) return;
    try { await api(`/api/characters/${c.slug}`, {method: "DELETE"}); } catch (err) { alert(err.message); } refresh();
  });
}

function drawPick() {
  const ready = characters.filter(c => c.status === "ready");
  picked = new Set([...picked].filter(s => ready.some(c => c.slug === s)));
  const first = c => { for (let i = 0; i < c.crops; i++) if (!c.excluded.includes(i)) return i; return 0; };
  $("#pick").innerHTML = ready.length ? ready.map(c => `
    <label class="${picked.has(c.slug) ? "on" : ""}"><input type="checkbox" value="${c.slug}" ${picked.has(c.slug) ? "checked" : ""}>
      <img src="/api/characters/${c.slug}/crops/${first(c)}" alt=""><span>${esc(c.name)}</span></label>`).join("")
    : `<div class="hint">${t("noReady")}</div>`;
  $("#pick").querySelectorAll("input").forEach(i => i.onchange = () => {
    i.checked ? picked.add(i.value) : picked.delete(i.value);
    if (picked.size > 4) { picked.delete(i.value); i.checked = false; alert(t("max4")); }
    i.closest("label").classList.toggle("on", i.checked);
    drawGroupNote(true);
  });
}

const pctOf = j => j.total > 0 ? Math.round(100 * j.step / j.total) : 0;
const etaOf = s => s == null ? "" : t("hm", Math.floor(s / 3600), Math.max(1, Math.round((s % 3600) / 60)));
const whoOf = j => esc(j.names.join(" + ")) + (j.group ? ` (${t("groupOf")})` : "");

function drawStatus() {
  const box = $("#trainStatus"), jobs = training.jobs || [];
  box.hidden = !jobs.length;
  if (!jobs.length) return;
  const lines = jobs.map(j => {
    let line;
    if (j.status === "training" && j.stage === "training") line = t("jobLearning", whoOf(j), pctOf(j), etaOf(j.eta));
    else if (j.status === "training" && (j.stage || "").startsWith("waiting")) line = t("jobWaiting", whoOf(j));
    else if (j.status === "training") line = t("jobPreparing", whoOf(j));
    else line = t("jobQueued", whoOf(j), j.position);
    const bar = j.status === "training" && j.stage === "training" ? `<div class="bar"><div style="width:${pctOf(j)}%"></div></div>` : "";
    return `<div class="job">${line}${bar}</div>`;
  }).join("");
  const gpus = (training.gpus || []).map(g => {
    const n = g.index + 1;
    if (g.training) return `<span class="train">${t("gpuTraining", n, esc(g.training.join(" + ")))}</span>`;
    return g.free_gb >= training.need_gb ? `<span class="free">${t("gpuFree", n)}</span>` : `<span class="busy">${t("gpuBusy", n)}</span>`;
  }).join("");
  box.innerHTML = `<h2>${t("statusTitle")}</h2>${lines}<div class="gpus">${gpus}</div><p class="hint" style="margin-top:12px">${t("statusHint")}</p>`;
}

// For 2+ characters: say whether they are trained as a group yet. `changed` = she just
// changed the selection, so a new combination also drops "how many versions" to 1.
function drawGroupNote(changed = false) {
  const box = $("#groupNote");
  if (picked.size < 2) { box.hidden = true; return; }
  const key = [...picked].sort().join("+");
  const g = (training.groups || []).find(x => [...x.members].sort().join("+") === key);
  const job = g && (training.jobs || []).find(j => j.group && j.names.join("+") === g.names.join("+"));
  let cls = "new", text = t("groupNew");
  if (g && g.status === "current") { cls = "ok"; text = t("groupReady"); }
  else if (job && job.status === "training" && job.stage === "training") { cls = "wait"; text = t("groupLearning", pctOf(job), etaOf(job.eta)); }
  else if (g && ["queued", "training"].includes(g.status)) { cls = "wait"; text = t("groupQueued"); }
  if (changed && cls !== "ok") $("#vars").value = "1";
  box.className = `groupnote ${cls}`; box.textContent = text; box.hidden = false;
}

document.querySelectorAll('input[name="kind"]').forEach(r => r.onchange = () =>
  document.querySelectorAll(".kinds label").forEach(l => l.classList.toggle("on", l.querySelector("input").checked)));

$("#makeBtn").onclick = async () => {
  const msg = $("#makeMsg"); msg.className = "msg"; msg.textContent = "";
  if (!picked.size) { msg.className = "msg err"; msg.textContent = t("pickOne"); return; }
  if ($("#scene").value.trim().length < 3) { msg.className = "msg err"; msg.textContent = t("describe"); return; }
  $("#makeBtn").disabled = true;
  try {
    const kind = document.querySelector('input[name="kind"]:checked').value;
    const made = await api("/api/pages", json({characters: [...picked], scene: $("#scene").value, orientation: $("#orient").value, variations: +$("#vars").value, kind}));
    msg.className = "msg ok"; msg.textContent = t("onTheWay", made.length, kind === "cover");
    await refresh();
    document.querySelector('nav button[data-tab="pages"]').click();
  } catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
  $("#makeBtn").disabled = false;
};

function drawPages() {
  const g = $("#gallery");
  if (!pages.length) { g.innerHTML = `<div class="empty card" style="grid-column:1/-1">${t("noPages")}</div>`; return; }
  g.innerHTML = pages.map(p => {
    const land = p.orientation === "landscape" ? "land" : "";
    let img = '<div class="spinner"></div>';
    if (p.status === "done") img = `<a href="/api/pages/${p.id}/png" target="_blank"><img loading="lazy" src="/api/pages/${p.id}/thumb" alt=""></a>`;
    if (p.status === "failed") img = `<div class="msg err" style="padding:12px">${esc(p.error || "failed")}</div>`;
    const note = p.cast ? `<div class="note">${p.cast.used ? t("castUsed") : t("castLearning")}</div>` : "";
    return `<div class="pagecard"><div class="img ${land}">${img}</div><div class="body">
      <div class="scene">${p.kind === "cover" ? `<span class="tag">${t("cover")}</span>` : ""}${esc(p.scene)}</div>
      <div class="who">${esc((p.names || []).join(", "))} · ${new Date(p.created * 1000).toLocaleString(lang === "es" ? "es-PR" : "en-US")}</div>${note}
      <div class="links">${p.status === "done" ? `<a href="/api/pages/${p.id}/pdf">PDF</a><a href="/api/pages/${p.id}/png" download>PNG</a>` : `<span class="hint">${p.status === "failed" ? "" : t("drawing")}</span>`}
        ${["done","failed"].includes(p.status) ? `<button class="secondary" data-redo="${p.id}">${t("redo")}</button>` : ""}
        <span style="flex:1"></span><button class="danger" data-pdel="${p.id}">${t("remove")}</button></div></div></div>`;
  }).join("");
  g.querySelectorAll("[data-pdel]").forEach(b => b.onclick = async () => {
    if (!confirm(t("confirmPageRemove"))) return;
    try { await api(`/api/pages/${b.dataset.pdel}`, {method: "DELETE"}); } catch (err) { alert(err.message); } refresh();
  });
  g.querySelectorAll("[data-redo]").forEach(b => b.onclick = async () => {
    b.disabled = true; try { await api(`/api/pages/${b.dataset.redo}/redo`, {method: "POST"}); } catch (err) { alert(err.message); } refresh();
  });
}

$("#addForm").onsubmit = async e => {
  e.preventDefault(); const msg = $("#addMsg"); msg.className = "msg"; msg.textContent = t("uploading"); $("#addBtn").disabled = true;
  const fd = new FormData(); fd.append("name", $("#cname").value.trim()); fd.append("kind", $("#ckind").value.trim());
  fd.append("sheet", $("#csheet").files[0]);
  if ($("#csheetbw").files[0]) fd.append("sheet_bw", $("#csheetbw").files[0]);
  try {
    const c = await api("/api/characters", {method: "POST", body: fd});
    msg.className = "msg ok"; msg.textContent = t("uploaded", c.name);
    e.target.reset(); await refresh();
  } catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
  $("#addBtn").disabled = false;
};

api("/api/me").then(start).catch(() => showLogin());
</script>
</body>
</html>
