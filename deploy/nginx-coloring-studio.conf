# Coloring Studio - internal only. -> /etc/nginx/sites-available/coloring-studio
# 10.3.0.0/16, except the two hosts that relay INTERNET traffic into the LAN
# (pfSense 10.3.1.254, portal nginx 10.3.1.242) - same rule as the imagegen API.
server {
    listen 8090;
    server_name _;

    deny  10.3.1.254;
    deny  10.3.1.242;
    allow 10.3.0.0/16;
    allow 127.0.0.1;
    deny  all;

    client_max_body_size 30m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
