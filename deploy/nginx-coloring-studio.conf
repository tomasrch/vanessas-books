# Vanessa's Coloring Books - internal only. -> /etc/nginx/sites-available/coloring-studio
# Allowed: 10.3.0.0/16, except the two hosts that relay INTERNET traffic into the LAN
# (pfSense 10.3.1.254, portal nginx 10.3.1.242) - same rule as the imagegen API.
# IPv4 only on purpose: the DNS name must have an A record and NO AAAA.
#
#   https://vanessasbooks.ivns.lab   main address (self-signed cert, 825 days - Apple's maximum)
#   http://vanessasbooks.ivns.lab    -> redirect to https
#   http://10.3.1.240:8090           fallback by IP (plain HTTP)

server {
    listen 80;
    server_name vanessasbooks.ivns.lab;
    include /etc/nginx/snippets/coloring-studio-allow.conf;
    return 301 https://vanessasbooks.ivns.lab$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vanessasbooks.ivns.lab;
    ssl_certificate     /etc/nginx/ssl/vanessasbooks.crt;
    ssl_certificate_key /etc/nginx/ssl/vanessasbooks.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/coloring-studio-allow.conf;
    include /etc/nginx/snippets/coloring-studio-app.conf;
}

server {
    listen 8090;
    server_name _;
    include /etc/nginx/snippets/coloring-studio-allow.conf;
    include /etc/nginx/snippets/coloring-studio-app.conf;
}
